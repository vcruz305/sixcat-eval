[project]
name = "sixcat-eval"
version = "0.4.0"
description = "Six community LLM categories + one overall score. Fast local OpenAI-compatible eval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langdetect>=1.0.9,<2"]
license = "MIT"
authors = [{ name = "Victor Cruz" }]

[project.scripts]
sixcat = "sixcat.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sixcat*"]

[tool.setuptools.package-data]
sixcat = ["model-policies.json", "data/*.jsonl"]
